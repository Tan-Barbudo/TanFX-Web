<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="redPad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#b80d22"/>
    </linearGradient>
    <linearGradient id="bluePad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="greenPad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="amberPad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background console chassis -->
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="36" fill="none" stroke="#252d3d" stroke-width="4"/>

  <!-- Brand header bar in icon -->
  <text x="56" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4">TAN FX</text>
  <text x="56" y="122" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="2">PERFORMANCE SOUNDBOARD</text>
  <circle cx="440" cy="85" r="12" fill="#ef4444" filter="url(#glow)"/>

  <!-- 3x3 stylized soundboard pads matrix -->
  <!-- Row 1 -->
  <rect x="56" y="150" width="112" height="96" rx="14" fill="url(#bluePad)" opacity="0.95"/>
  <rect x="184" y="150" width="112" height="96" rx="14" fill="url(#amberPad)" opacity="0.95"/>
  <rect x="312" y="150" width="112" height="96" rx="14" fill="url(#greenPad)" opacity="0.95"/>

  <!-- Row 2 -->
  <rect x="56" y="262" width="112" height="96" rx="14" fill="#1e2638" stroke="#334155" stroke-width="2"/>
  <rect x="184" y="262" width="112" height="96" rx="14" fill="url(#redPad)" filter="url(#glow)"/>
  <rect x="312" y="262" width="112" height="96" rx="14" fill="#1e2638" stroke="#334155" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="56" y="374" width="112" height="96" rx="14" fill="url(#greenPad)" opacity="0.8"/>
  <rect x="184" y="374" width="112" height="96" rx="14" fill="#1e2638" stroke="#334155" stroke-width="2"/>
  <rect x="312" y="374" width="112" height="96" rx="14" fill="url(#bluePad)" opacity="0.8"/>

  <!-- Central pad visual pulse / play icon -->
  <polygon points="232,298 256,310 232,322" fill="#ffffff"/>
</svg>
